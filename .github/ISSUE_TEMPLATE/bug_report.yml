name: Bug Report
description: Report a bug in the system
title: "[Bug]: "
labels:
  - bug
body:
  - type: input
    id: module
    attributes:
      label: Module
      description: Which module is impacted?
      placeholder: e.g., auth, billing, ui
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this bug?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See the error.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: Explain what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Add screenshots if applicable.
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: e.g., Windows, macOS, Linux
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: e.g., Chrome, Firefox
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: e.g., 1.0.0
  - type: textarea
    id: related_commits
    attributes:
      label: Related commits
      description: Paste one commit per line (SHA or URL).
      placeholder: |
        abc1234
        def5678
      render: shell
  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Add any other context about the problem here.