name: Documentation
description: Suggest updates or additions to documentation
title: "[Docs]: "
labels:
  - documentation
body:
  - type: input
    id: module
    attributes:
      label: Module
      description: Which docs area is impacted?
      placeholder: e.g., setup, API, deployment
  - type: textarea
    id: documentation_update
    attributes:
      label: Documentation Update
      description: What part of the documentation needs to be updated or added?
    validations:
      required: true
  - type: textarea
    id: why_needed
    attributes:
      label: Why Is This Needed?
      description: Explain the importance of this update.
    validations:
      required: true
  - type: textarea
    id: suggested_changes
    attributes:
      label: Suggested Changes
      description: Provide a detailed description of the changes.
  - type: textarea
    id: related_commits
    attributes:
      label: Related commits
      description: Paste one commit per line (SHA or URL).
      placeholder: |
        abc1234
        def5678
      render: shell
  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Include any related resources.