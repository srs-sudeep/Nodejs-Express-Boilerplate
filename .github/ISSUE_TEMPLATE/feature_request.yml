name: Feature Request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: input
    id: module
    attributes:
      label: Module
      description: Which module is this feature for?
      placeholder: e.g., auth, billing, ui
  - type: textarea
    id: feature_description
    attributes:
      label: Feature Description
      description: What feature would you like to see?
    validations:
      required: true
  - type: textarea
    id: why_needed
    attributes:
      label: Why Is This Needed?
      description: Explain the problem or need for this feature.
    validations:
      required: true
  - type: textarea
    id: suggested_solutions
    attributes:
      label: Suggested Solutions
      description: Describe how this feature could be implemented.
  - type: textarea
    id: related_commits
    attributes:
      label: Related commits
      description: Paste one commit per line (SHA or URL).
      placeholder: |
        abc1234
        def5678
      render: shell
  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Add any relevant screenshots, links, or resources.